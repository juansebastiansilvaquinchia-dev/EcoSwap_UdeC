{% extends 'base.html' %}
{% block title %}Mi Perfil — EcoSwap UdeC{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <!-- Tarjeta de Perfil Estilo App -->
        <div class="card card-hologram border-0 p-4 p-md-5 bg-white shadow-lg mb-4" style="border-radius: 25px;">
            <div class="d-flex align-items-center gap-4 flex-wrap flex-md-nowrap">
                <div class="bg-success text-white rounded-circle d-flex justify-content-center align-items-center shadow" style="width: 90px; height: 90px; font-size: 2.5rem; font-weight: bold;">
                    {{ nombre|slice:":1" }}
                </div>
                <div>
                    <h3 class="fw-bold text-dark mb-1">{{ nombre }}</h3>
                    <p class="text-muted mb-2"><i class="bi bi-envelope-check text-success me-1"></i> {{ email }}</p>
                    <span class="badge bg-success bg-opacity-10 text-success px-3 py-2 rounded-pill fw-bold">
                        <i class="bi bi-patch-check-fill me-1"></i> Estudiante UdeC - Ingeniería de Software
                    </span>
                </div>
            </div>

            <hr class="my-4 text-muted opacity-25">

            <!-- Estadísticas del Usuario -->
            <div class="row text-center g-3">
                <div class="col-4">
                    <div class="p-3 bg-light rounded-4">
                        <h4 class="fw-bold text-success mb-0">3</h4>
                        <small class="text-muted">Publicaciones</small>
                    </div>
                </div>
                <div class="col-4">
                    <div class="p-3 bg-light rounded-4">
                        <h4 class="fw-bold text-success mb-0">5</h4>
                        <small class="text-muted">Trueques</small>
                    </div>
                </div>
                <div class="col-4">
                    <div class="p-3 bg-light rounded-4">
                        <h4 class="fw-bold text-success mb-0">2</h4>
                        <small class="text-muted">Seguidores</small>
                    </div>
                </div>
            </div>

            <div class="mt-4 d-flex gap-3 justify-content-end">
                <a href="/" class="btn btn-outline-success rounded-pill px-4">
                    <i class="bi bi-grid me-1"></i> Ver Catálogo
                </a>
                <a href="{% url 'cerrar_sesion' %}" class="btn btn-danger rounded-pill px-4">
                    <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
